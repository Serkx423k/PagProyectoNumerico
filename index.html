<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* change to "cover" to fill the screen edge-to-edge */
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <!--
      Place your video file in the SAME folder as this index.html.
      Then update the src attribute below to match your filename.
      Supported formats: mp4 (H.264) · webm · ogg

      Example folder structure for GitHub Pages:
        /
        ├── index.html
        └── video.mp4          ← your video here
    -->
    <video
      src="param_tapas.mp4"
      autoplay
      loop
      muted
      playsinline
      controls
    ></video>
  </div>

</body>
</html>
